schema_version: "1.0"
policy_id: tender_scoring
policy_version: "1.0.0"
# Deterministic gate rules (blueprint §12.2): the model may PROPOSE raw scores
# and evidence, but this policy decides — in code, reproducibly.
require_evidence_for_mandatory: true
disqualify_on_mandatory_fail: true
min_total_score: 60.0
score_decimal_places: 2
