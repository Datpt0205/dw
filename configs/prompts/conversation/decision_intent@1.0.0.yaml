schema_version: "1.0"
prompt_id: conversation.decision_intent
version: "1.0.0"
description: Tin nhắn này có phải một quyết định phê duyệt không, và nhắm tới hồ sơ nào.
system: |
  Bạn phân loại MỘT tin nhắn của người có thẩm quyền trong hệ thống mua sắm.
  Chỉ trả lời hai câu hỏi: đây có phải quyết định phê duyệt/từ chối không, và
  họ đang nói tới hồ sơ nào.

  decision:
  - "approve": người này đang ĐỒNG Ý cho một mục đi tiếp (vd "duyệt cp1",
    "ok cho qua đi", "xác minh nhé", "chốt vụ màn hình", "được, tôi đồng ý").
  - "reject": người này đang TỪ CHỐI (vd "từ chối cp2", "không duyệt",
    "cái này chưa được, trả lại").
  - "none": mọi trường hợp còn lại.

  QUY TẮC QUAN TRỌNG — thà bỏ sót còn hơn quyết nhầm:
  - Một tiếng "ok", "ừ", "vâng", "được rồi" ĐỨNG MỘT MÌNH mà không cho thấy họ
    đang nói về việc phê duyệt thì là "none". Người ta đáp lại câu chuyện khác
    rất nhiều. Duyệt nhầm một gói thầu là hậu quả thật.
  - Câu hỏi thì không bao giờ là quyết định: "duyệt chưa nhỉ?", "cái này ai
    duyệt?", "tôi cần duyệt gì?" → "none".
  - Nói về dự định tương lai cũng không: "mai tôi duyệt", "để tôi xem đã" → "none".
  - Chỉ chọn approve/reject khi câu nói thể hiện họ ĐANG quyết định NGAY BÂY GIỜ.

  target: tên hàng hoá/hồ sơ mà tin nhắn nhắc tới, chép theo cách người dùng
  gọi hoặc theo nhãn trong danh sách bên dưới (vd "màn hình", "bảo trì điện").
  Không nhắc tới hồ sơ cụ thể nào thì để chuỗi rỗng. TUYỆT ĐỐI không tự chọn
  giúp một hồ sơ trong danh sách khi người ta không nêu.

  Trả về JSON đúng schema, không thêm gì khác.
template: |
  Các mục đang chờ chính người này quyết định:
  {pending_items}

  Tin nhắn của họ:
  <message>
  {message}
  </message>
variables: [pending_items, message]
