[project]
name = "digital-worker-platform"
version = "0.1.0"
description = "Multi-tenant Digital Worker platform (tender + work_ops bounded contexts)"
requires-python = ">=3.12"
license = { text = "Proprietary" }

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/python/*"]

[tool.uv.sources]
dw-kernel = { workspace = true }
dw-platform = { workspace = true }
dw-agent-runtime = { workspace = true }
dw-knowledge = { workspace = true }
dw-memory = { workspace = true }
dw-connectors = { workspace = true }
dw-tender = { workspace = true }
dw-work-ops = { workspace = true }
dw-observability = { workspace = true }
dw-evals = { workspace = true }
dw-api = { workspace = true }
dw-worker = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<1",
    "import-linter>=2.1,<3",
    "pre-commit>=4.0,<5",
    "asgi-lifespan>=2.1,<3",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format for the whole Python workspace
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/python/*/src", "apps/api/src", "apps/worker/src", "scripts"]
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
    "TID", # tidy imports
]
ignore = [
    "SIM117", # nested with is sometimes clearer
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_tender",
    "dw_work_ops",
    "dw_observability",
    "dw_evals",
    "dw_api",
    "dw_worker",
]

# ---------------------------------------------------------------------------
# mypy — strict for src, relaxed-def for tests
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = [
    "packages/python",
    "apps/api/src",
    "apps/worker/src",
    "scripts",
]
exclude = ["db/migrations/versions"]
mypy_path = [
    "packages/python/dw_kernel/src",
    "packages/python/dw_platform/src",
    "packages/python/dw_agent_runtime/src",
    "packages/python/dw_knowledge/src",
    "packages/python/dw_memory/src",
    "packages/python/dw_connectors/src",
    "packages/python/dw_tender/src",
    "packages/python/dw_work_ops/src",
    "packages/python/dw_observability/src",
    "packages/python/dw_evals/src",
    "apps/api/src",
    "apps/worker/src",
    "packages/python/dw_platform/tests/integration",
]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["packages/python", "apps/api/tests", "apps/worker/tests", "tests"]
markers = [
    "unit: fast tests without external services",
    "integration: tests requiring Postgres/Qdrant/Redis/MinIO",
    "contract: API/event/tool schema contract tests",
    "e2e: end-to-end vertical slice tests",
    "eval: evaluation smoke/regression tests",
    "architecture: import-boundary and dependency-rule tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------------------
# import-linter — architecture boundaries (extended each phase)
# ---------------------------------------------------------------------------
[tool.importlinter]
include_external_packages = true
root_packages = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_tender",
    "dw_work_ops",
    "dw_observability",
    "dw_evals",
]

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent (tender <-/-> work_ops)"
type = "independence"
modules = ["dw_tender", "dw_work_ops"]

[[tool.importlinter.contracts]]
name = "Kernel is pure (stdlib only)"
type = "forbidden"
source_modules = ["dw_kernel"]
forbidden_modules = [
    "pydantic",
    "fastapi",
    "sqlalchemy",
    "alembic",
    "langgraph",
    "langchain",
    "qdrant_client",
    "redis",
    "httpx",
    "boto3",
    "minio",
    "openai",
    "anthropic",
    "slack_sdk",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_tender",
    "dw_work_ops",
    "dw_observability",
    "dw_evals",
]

[[tool.importlinter.contracts]]
name = "Domain layers never import frameworks or providers"
type = "forbidden"
source_modules = [
    "dw_tender.domain",
    "dw_work_ops.domain",
    "dw_platform.domain",
]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "langgraph",
    "langchain",
    "qdrant_client",
    "redis",
    "httpx",
    "boto3",
    "minio",
    "openai",
    "anthropic",
    "slack_sdk",
    "opentelemetry",
]

[[tool.importlinter.contracts]]
name = "Contexts do not import app composition roots"
type = "forbidden"
source_modules = [
    "dw_tender",
    "dw_work_ops",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
]
forbidden_modules = ["dw_api", "dw_worker"]
