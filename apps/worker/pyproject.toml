[project]
name = "dw-worker"
version = "0.1.0"
description = "Async worker process: outbox processing, workflow consumers, schedulers, knowledge ingestion"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "dw-knowledge",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
]

[project.optional-dependencies]
# Heavy multi-format parsing + OCR (torch, layout + OCR models). Installed in the
# worker image only; the ingest consumer degrades to plaintext when absent.
parsers = [
    "docling>=2.15,<3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_worker"]
