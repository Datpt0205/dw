[project]
name = "dw-api"
version = "0.1.0"
description = "API process: FastAPI composition root and presentation layer"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "dw-agent-runtime",
    "dw-knowledge",
    "dw-memory",
    "dw-connectors",
    "dw-work-ops",
    "dw-tender",
    "dw-observability",
    "minio>=7.2,<8",
    "qdrant-client>=1.12,<1.15",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.18,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_api"]
