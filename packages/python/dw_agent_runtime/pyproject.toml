[project]
name = "dw-agent-runtime"
version = "0.1.0"
description = "Agent runtime: worker/tool contracts, workflow runner port, model gateway (adapters arrive in phase 2)"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "dw-observability",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "langgraph>=0.6,<2",
    "langchain-core>=1,<2",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
    "deepagents>=0.7.8",
    "langchain-openai>=1.6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_agent_runtime"]
