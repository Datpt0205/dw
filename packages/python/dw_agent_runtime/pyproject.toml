[project]
name = "dw-agent-runtime"
version = "0.1.0"
description = "Agent runtime: worker/tool contracts, workflow runner port, model gateway (adapters arrive in phase 2)"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_agent_runtime"]
