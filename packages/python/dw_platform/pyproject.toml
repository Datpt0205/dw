[project]
name = "dw-platform"
version = "0.1.0"
description = "Platform context: tenancy, identity, entitlement, authorization, approval, audit, outbox"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "pyjwt[crypto]>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_platform"]
