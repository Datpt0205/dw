[project]
name = "dw-observability"
version = "0.1.0"
description = "Observability: metric registry, redaction, telemetry port, OTel + Langfuse adapters"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_observability"]
