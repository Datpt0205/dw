[project]
name = "dw-observability"
version = "0.1.0"
description = "Observability: metric name registry, redaction; OTel/Langfuse adapters arrive in phase 5"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_observability"]
