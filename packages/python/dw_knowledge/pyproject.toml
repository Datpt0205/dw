[project]
name = "dw-knowledge"
version = "0.1.0"
description = "Knowledge: ingestion, retrieval gateway with trusted tenant/ACL filter injection, evidence contracts"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "qdrant-client>=1.12,<1.15",
    "minio>=7.2,<8",
    "httpx>=0.27,<0.29",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_knowledge"]
