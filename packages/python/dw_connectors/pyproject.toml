[project]
name = "dw-connectors"
version = "0.1.0"
description = "Connector gateway: canonical contracts, mock task connector, credential references"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "websockets>=13.1,<16",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_connectors"]
