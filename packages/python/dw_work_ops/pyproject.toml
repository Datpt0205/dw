[project]
name = "dw-work-ops"
version = "0.1.0"
description = "Work Operations bounded context: meeting-to-action Digital Worker"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "dw-agent-runtime",
    "dw-knowledge",
    "dw-memory",
    "dw-connectors",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "langgraph>=0.6,<2",
    "langchain-core>=1,<2",
    "fastapi>=0.115,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_work_ops"]
