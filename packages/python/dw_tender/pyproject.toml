[project]
name = "dw-tender"
version = "0.1.0"
description = "Tender bounded context: procurement tender analysis Digital Worker"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_tender"]
