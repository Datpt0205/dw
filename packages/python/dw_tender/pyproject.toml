[project]
name = "dw-tender"
version = "0.1.0"
description = "Tender bounded context: procurement tender analysis Digital Worker"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    "dw-agent-runtime",
    "dw-knowledge",
    "dw-memory",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "langgraph>=0.6,<2",
    "langchain-core>=1,<2",
    "fastapi>=0.115,<1",
    "pyyaml>=6.0,<7",
    # The intake quota cuts its period in a named zone. Linux images carry a
    # tz database; Windows does not, and zoneinfo then fails on every lookup.
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_tender"]
