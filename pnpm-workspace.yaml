packages:
  - apps/web
  - packages/typescript/*
allowBuilds:
  sharp: true
  unrs-resolver: true
# Force patched versions of vulnerable transitive deps (pnpm audit high+).
# Always bound to the SAME major (^): an open ">=x" lets pnpm jump a major and
# hand a dependent an API it was never written against — ">=4.3.1" pulled
# js-yaml 5 into @redocly/openapi-core and broke `make generate-contracts`.
overrides:
  "js-yaml@>=4.0.0 <4.3.1": "^4.3.1"
  "nanoid@<3.3.17": "^3.3.17"
  "sharp@<0.35.0": ">=0.35.0"
  "postcss@<8.5.18": ">=8.5.18"
  "brace-expansion@<1.1.17": "^1.1.17"
  "brace-expansion@>=2.0.0 <2.1.3": "^2.1.3"
  "brace-expansion@>=4.0.0 <5.0.8": "5.0.9"
