# Opt-in GPU overlay for TEI embeddings.
#
# The base compose file runs BGE-M3 on the CPU image so it starts anywhere
# (CI runners, GPUs below compute capability 7.5 such as Pascal/GTX 10xx).
# Machines with a Turing-or-newer GPU and the NVIDIA container runtime can
# layer this file on top:
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.gpu.yml --profile full up -d
#
# Override the image via DW_TEI_EMBED_GPU_IMAGE for a different CUDA arch
# (e.g. ...:89-1.6 for Ada, ...:hopper-1.6 for H100).
services:
  tei-embed:
    image: ${DW_TEI_EMBED_GPU_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:turing-1.6}
    command: ["--model-id", "BAAI/bge-m3", "--dtype", "float16", "--port", "80"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
