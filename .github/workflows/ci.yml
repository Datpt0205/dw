name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python lint · typecheck · unit · architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m unit

      - name: Architecture tests
        run: |
          uv run lint-imports
          uv run python scripts/verify_architecture.py

  frontend-quality:
    name: Frontend lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build web
        run: pnpm --filter @dw/web build

  compose-validate:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose profiles
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile infra config -q
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile full config -q
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile full --profile observability config -q
